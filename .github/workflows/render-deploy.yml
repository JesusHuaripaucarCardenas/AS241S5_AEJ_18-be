name: CI/CD Backend - Deploy to Render

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-deploy:
    name: Build, Test & Deploy Backend to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build con Maven (sin tests)
        run: mvn clean package -DskipTests

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}
          password: ${{ secrets.DOCKERHUB_TOKEN_NOMBRE }}

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jesushuaripaucarcardenas/as241s5_aej_18-be:latest
            jesushuaripaucarcardenas/as241s5_aej_18-be:${{ github.sha }}

      - name: Deploy a Render (Backend)
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_BE }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            | jq .

      - name: Verificar deploy exitoso
        run: echo "✅ Backend desplegado en Render exitosamente"