name: CI/CD Backend - Spring Boot

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build con Maven (sin tests)
        run: mvn clean package -DskipTests

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}
          password: ${{ secrets.DOCKERHUB_TOKEN_NOMBRE }}

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}/as241s5_aej_18-be:2jun2026
            ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}/as241s5_aej_18-be:${{ github.sha }}

      - name: Verificar imagen publicada
        run: echo " Imagen backend publicada en DockerHub exitosamente"